# This workflow is named "CI" and will appear in the GitHub Actions tab.
name: CI

# This section defines the events that trigger the workflow.
on:
  # Run the workflow on push events to the "main" branch and release branches.
  push:
    branches:
      - main
      - "release/**"
  # Run the workflow on pull request events targeting the "main" branch.
  pull_request:
    branches:
      - main

# A workflow is composed of one or more jobs that can run in parallel or sequentially.
jobs:
  # This job installs dependencies and caches them for other jobs.
  install:
    # The job will run on the latest version of an Ubuntu virtual machine.
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out your repository's code so the workflow can access it.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up the pnpm package manager.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # Step 3: Set up a Node.js environment.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      # Step 4: Install the project dependencies using pnpm.
      - name: Install dependencies
        run: pnpm install

      # Step 5: Upload the node_modules directory as an artifact.
      # This allows other jobs to download and use it without reinstalling.
      - name: Upload dependencies artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules/

  # This job runs the linter and depends on the 'install' job.
  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Download dependencies artifact
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules/
      # This step ensures that pnpm's internal state and binary links are correct after restoring the artifact.
      - name: Verify installation
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm run lint

  # Overlay and panel are two entry points of a single Vite build (see
  # vite.config.ts), so there is one build job producing one dist/ — the old
  # build:overlay / build:panel scripts no longer exist.
  build:
    needs: install
    runs-on: ubuntu-latest
    env:
      # Single public origin; lobbies are routed by path underneath it.
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      VITE_DEVELOPER: false
      VITE_DISABLE_BACKEND: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Download dependencies artifact
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules/
      # This step ensures that pnpm's internal state and binary links are correct after restoring the artifact.
      - name: Verify installation
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist
